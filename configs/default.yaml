# Deprecated compatibility file
#
# ConfTest does not load this YAML file at runtime. Runtime settings are defined
# by src/conftest/config.py and overridden with CONFTEST_* environment variables;
# copy .env.example to .env for the complete list. Tuned decision thresholds
# (tau_abstain, tau_conf, and budget_ratio) belong only to
# models/policy_config.json, produced by scripts/tune_policy.py.
#
# This file remains as a pointer for old links. Do not add configuration values
# here: they would be inert and could contradict the settings actually in force.
configuration:
  runtime_source: "src/conftest/config.py"
  environment_template: ".env.example"
  policy_source: "models/policy_config.json"
