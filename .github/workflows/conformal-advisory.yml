# Conformal Test Selection — ADVISORY (non-gating).
#
# On every PR this runs the conformal-test-selection pipeline on the *shipped*
# fitted artefacts and reports what it WOULD select, plus the PAC coverage
# guarantee. It skips no real tests and never fails the build: it exists to
# connect the conformal selector to CI as a shadow/advisory signal, so the
# guarantee can be watched on real automation before anyone trusts it to gate.
#
# Why this can run on a bare checkout: models/*.pkl and reports/*.json are
# committed (~1 MB). The 300 MB reused corpus is NOT, so `cli.py evaluate`
# cannot re-measure here — instead we surface the committed held-out metrics
# and run a live `predict` on features extracted from the real PR diff (falling
# back to examples/sample_candidates.json when there is no diff/test to score).
name: Conformal Test Selection (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  conformal-advisory:
    name: 🔮 Conformal selection (advisory, skips nothing)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          # Full history: build_live_candidates diffs base...head and reads
          # `git log` for prior-modification counts, so both PR endpoints and
          # the merge-base must be reachable.
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: conformal-test-selection/requirements.txt

      - name: 📦 Install conformal-test-selection dependencies
        working-directory: conformal-test-selection
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The committed .pkl artefacts were fitted under the newer resolves
          # (see README "Environment compatibility"); the pinned scikit-learn in
          # requirements.txt (1.3.0) cannot unpickle a ColumnTransformer saved by
          # 1.9. Override the two pickle-critical libs so the live predict loads.
          pip install "scikit-learn==1.9.0" "xgboost==3.2.0"

      - name: 🔮 Run conformal advisory selection
        working-directory: conformal-test-selection
        env:
          COMMENT_PATH: ${{ github.workspace }}/conformal_advisory_comment.md
          # Feed the real PR to the live feature extractor. On workflow_dispatch
          # these PR fields are empty → build_live_candidates returns [] → the
          # report falls back to the committed sample.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python examples/advisory_report.py

      - name: 💬 Post advisory summary to the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = `${process.env.GITHUB_WORKSPACE}/conformal_advisory_comment.md`;
            if (!fs.existsSync(path)) {
              core.info('No advisory comment produced; skipping.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
