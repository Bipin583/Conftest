name: ConfTest Regression Test Selection CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  conftest-rts:
    name: 🛡️ ConfTest Intelligent RTS & Test Execution
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fails the build if any label-ish variable is ever assigned from a
      # random draw. This is the defect that invalidated every result in the
      # first iteration of the project; it must never come back silently.
      - name: 🚫 Reject Fabricated Failure Labels
        run: python scripts/check_no_fabricated_labels.py

      - name: 🧠 Run ConfTest Selective RTS Engine
        id: select_tests
        run: |
          python scripts/select_tests.py \
            --repo-path . \
            --commit-sha "${{ github.event.pull_request.head.sha || 'HEAD' }}" \
            --budget 0.25 \
            --output-report reports/conftest_selection_report.json

      - name: 🧪 Execute Selected Test Cases
        id: run_pytest
        run: |
          python scripts/select_tests.py \
            --repo-path . \
            --commit-sha "${{ github.event.pull_request.head.sha || 'HEAD' }}" \
            --budget 0.25 \
            --execute

      - name: 💬 Post ConfTest Summary to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('reports/conftest_selection_report.json')) {
              const data = JSON.parse(fs.readFileSync('reports/conftest_selection_report.json', 'utf8'));
              const mode = data.decision_mode || 'FAST_SELECTED';
              const saved = data.test_reduction_pct || 0;
              const selected = data.selected_count || 0;
              const total = data.total_count || 0;
              
              const body = `## 🛡️ ConfTest CI Test Selection Report\n\n` +
                `- **Execution Mode:** \`${mode}\`\n` +
                `- **Tests Selected:** **${selected} / ${total}** (${saved}% time reduction)\n` +
                `- **Model Confidence:** \`${(data.top_confidence * 100).toFixed(1)}%\`\n` +
                `- **Epistemic Uncertainty:** \`${data.epistemic_uncertainty.toFixed(4)}\`\n\n` +
                `*Executed via ConfTest GitHub Action.*`;
                
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
