name: ConfTest Regression Test Selection CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  conftest-rts:
    name: 🛡️ ConfTest Intelligent RTS & Test Execution
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    # Optional: when this secret is set to a deployed ConfTest URL, the PR's
    # decision is also POSTed there so it persists to that instance's DB and
    # shows on the Analytics dashboard. Unset (the default) => the step below is
    # skipped and CI stays fully self-contained (no public URL needed).
    env:
      CONFTEST_API_URL: ${{ secrets.CONFTEST_API_URL }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fails the build if any label-ish variable is ever assigned from a
      # random draw. This is the defect that invalidated every result in the
      # first iteration of the project; it must never come back silently.
      - name: 🚫 Reject Fabricated Failure Labels
        run: python scripts/check_no_fabricated_labels.py

      # ConfTest's own test suite. Without this the pipeline could ship a
      # broken selector and still report a green tick, because every step
      # below exercises the engine rather than verifying it.
      - name: ✅ Run ConfTest Unit & Integration Test Suite
        run: python -m pytest tests/ -v --cov=src/conftest --cov-report=term-missing

      - name: 🧠 Run ConfTest Selective RTS Engine
        id: select_tests
        run: |
          python scripts/select_tests.py \
            --repo-path . \
            --commit-sha "${{ github.event.pull_request.head.sha || 'HEAD' }}" \
            --budget 0.25 \
            --timeout 600 \
            --output-json reports/conftest_selection_report.json

      - name: 🧪 Execute Selected Test Cases
        id: run_pytest
        run: |
          python scripts/select_tests.py \
            --repo-path . \
            --commit-sha "${{ github.event.pull_request.head.sha || 'HEAD' }}" \
            --budget 0.25 \
            --timeout 600 \
            --execute

      # Optional dashboard reporting: only runs when CONFTEST_API_URL is set.
      # Sends the PR's changed files to the deployed /api/v1/select so the
      # decision persists to that instance's DB and appears on the Analytics
      # page. continue-on-error keeps a flaky/unreachable dashboard from ever
      # failing the PR check.
      - name: 📡 Persist decision to ConfTest dashboard (optional)
        if: ${{ github.event_name == 'pull_request' && env.CONFTEST_API_URL != '' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          diff = subprocess.run(
              ["git", "diff", "--name-only", base, head],
              capture_output=True, text=True,
          ).stdout.split()
          payload = {
              "repository_name": os.environ["REPO"],
              "commit_sha": head,
              "commit_message": os.environ.get("PR_TITLE") or "Pull Request",
              "changed_files": [{"file_path": f, "change_type": "modified"} for f in diff],
              "budget_ratio": 0.25,
          }
          url = os.environ["CONFTEST_API_URL"].rstrip("/") + "/api/v1/select"
          req = urllib.request.Request(
              url, data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"}, method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"ConfTest dashboard persisted the decision (HTTP {r.status}).")
          except Exception as exc:
              print(f"Dashboard report skipped ({exc}); the PR comment above is unaffected.")
          PY

      - name: 💬 Post ConfTest Summary to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/conftest_selection_report.json')) return;
            const data = JSON.parse(fs.readFileSync('reports/conftest_selection_report.json', 'utf8'));
            const mode = data.decision_mode || 'FAST_SELECTED';
            // test_reduction_pct is 1 - selected/total: a fraction of the test
            // *count*. Calling it a time reduction asserts that every test costs
            // the same, which is false for any real suite, and `|| 0` additionally
            // turned a missing value into a reported 0%.
            const reduction = data.test_reduction_pct;
            const reductionLabel =
              (reduction === null || reduction === undefined)
                ? 'reduction not reported'
                : `${reduction}% fewer tests`;
            const selected = data.selected_count || 0;
            const total = data.total_count || 0;

            // Hidden marker so repeated pushes update one comment instead of
            // posting a new one each run (same pattern as ai-failure-analysis.yml).
            const marker = '<!-- conftest-rts-selection -->';
            const body = `${marker}\n## 🛡️ ConfTest CI Test Selection Report\n\n` +
              `- **Execution Mode:** \`${mode}\`\n` +
              `- **Tests Selected:** **${selected} / ${total}** (${reductionLabel})\n` +
              `- **Model Confidence:** \`${(data.top_confidence * 100).toFixed(1)}%\`\n` +
              `- **Epistemic Uncertainty:** \`${data.epistemic_uncertainty.toFixed(4)}\`\n\n` +
              `*Executed via ConfTest GitHub Action — commit \`${(data.commit_sha || '').slice(0, 8)}\`.*`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
