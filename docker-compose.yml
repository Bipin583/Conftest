services:
  conftest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conftest-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CONFTEST_ENV: production
      CONFTEST_LOG_LEVEL: INFO
      CONFTEST_DATABASE_URL: sqlite:////app/data/conftest.db
      CONFTEST_API_HOST: 0.0.0.0
      CONFTEST_API_PORT: "8000"
      CONFTEST_CORS_ALLOW_ORIGINS: '${CONFTEST_CORS_ALLOW_ORIGINS:-["http://localhost:8501","http://127.0.0.1:8501"]}'
      CONFTEST_GITHUB_WEBHOOK_SECRET: "${CONFTEST_GITHUB_WEBHOOK_SECRET:?Set CONFTEST_GITHUB_WEBHOOK_SECRET before starting the production stack}"
    volumes:
      - conftest-data:/app/data
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    command: ["uvicorn", "conftest.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  conftest-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conftest-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      CONFTEST_DATABASE_URL: sqlite:////app/data/conftest.db
    volumes:
      - conftest-data:/app/data
      - ./reports:/app/reports
    depends_on:
      - conftest-api
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  conftest-data:
    name: conftest-shared-data
