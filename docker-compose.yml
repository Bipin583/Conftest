services:
  # Single-service full stack, mirroring the Render deployment: nginx serves the
  # built React dashboard SPA at / and proxies /api, /health, /docs to the
  # FastAPI backend on a loopback port inside the container.
  #
  # For frontend development with hot reload, run the API alone
  # (`uvicorn conftest.api.main:app --port 8000`) and `npm run dev` in frontend/
  # (Vite proxies /api to :8000) instead of this container.
  conftest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Surfaced in /health as git_sha; compose can't interpolate a command
        # output, so shell exports or an .env override set it. Defaults to
        # "unknown" in the Dockerfile, which is honest for a local build.
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: conftest
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      CONFTEST_LOG_LEVEL: INFO
      CONFTEST_DATABASE_URL: sqlite:////app/data/conftest.db
      # Same-origin: the SPA calls the API through nginx, so no CORS origins.
      CONFTEST_CORS_ALLOW_ORIGINS: '${CONFTEST_CORS_ALLOW_ORIGINS:-[]}'
    volumes:
      - conftest-data:/app/data
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  conftest-data:
    name: conftest-shared-data
