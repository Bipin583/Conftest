[pytest]
# `testpaths` keeps a bare `pytest` from wandering into data/ or the parent
# ConfTest tree, both of which contain files named test_*.py that belong to a
# different project.
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    artifacts: needs the fitted .pkl files (skipped if absent)
    corpus: needs the 561k-row corpus behind data/splits (skipped if absent)
filterwarnings =
    ignore::DeprecationWarning:flask.*
