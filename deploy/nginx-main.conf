# Top-level nginx config for the non-root single-service container.
#
# The stock Debian nginx.conf assumes a root master process: it sets
# `user nginx;`, writes its pid to /run/nginx.pid and its logs to
# /var/log/nginx -- all of which require privileges the hardened container no
# longer has (see Dockerfile: the stack runs as `appuser`). A non-root master
# cannot write any of those paths and nginx aborts at startup.
#
# This replacement keeps everything nginx needs to write under /tmp (always
# world-writable) and drops the `user` directive entirely, so workers simply
# inherit the master's unprivileged uid. The per-deployment server block is
# still rendered into /etc/nginx/conf.d/default.conf by deploy/entrypoint.sh
# and pulled in by the include at the bottom.

worker_processes auto;

# Writable by any uid, so the unprivileged master can always open them. A
# missing/undeletable pid or error log is a fatal startup error, not a warning.
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/nginx-access.log;

    # Request buffering and upstream spool dirs. nginx creates these at startup;
    # under /tmp the non-root master can, whereas the /var/lib/nginx defaults it
    # cannot write to would fail the first buffered request.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;

    # The envsubst-rendered server block (listen ${PORT}, the /api, /docs and
    # dashboard routes) lives here.
    include /etc/nginx/conf.d/*.conf;
}
